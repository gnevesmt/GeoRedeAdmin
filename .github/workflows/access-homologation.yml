name: GeoRedeAdmin homologação — sem publicar
on:
  push:
    branches: [codex/backend-access-homologacao-20261009]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npx playwright install --with-deps chromium && npm test
        working-directory: homologacao
