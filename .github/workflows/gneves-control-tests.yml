name: GNEVES Control - testes
on:
  pull_request:
    paths:
      - 'gneves-control/**'
      - '.github/workflows/gneves-control-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-and-releases:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gneves-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gneves-control/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
